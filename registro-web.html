<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear Cuenta – Fresas con Crema</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose:     #e8547a;
      --rose-dk:  #c03a5e;
      --blush:    #fce8ee;
      --cream:    #fff8f5;
      --text:     #2d1a22;
      --muted:    #9c7a87;
      --border:   #f0d5dc;
      --white:    #ffffff;
      --shadow:   0 8px 40px rgba(232,84,122,.15);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
      padding: 2rem 1rem;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(232,84,122,.10) 0%, transparent 50%),
        radial-gradient(circle at 85% 80%, rgba(252,232,238,.60) 0%, transparent 50%);
    }

    .card {
      background: var(--white);
      border-radius: 24px;
      padding: 2.5rem 2rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      animation: slideUp .5s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .avatar {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--rose), var(--rose-dk));
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: .75rem;
      box-shadow: 0 4px 16px rgba(232,84,122,.35);
    }

    .avatar svg { width: 28px; height: 28px; fill: var(--white); }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--text);
      margin-bottom: .25rem;
    }

    .header p {
      font-size: .875rem;
      color: var(--muted);
      font-weight: 300;
    }

    /* ── Form ── */
    .form-group { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: .8125rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: .4rem;
      letter-spacing: .01em;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      left: .9rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      stroke: var(--muted);
      stroke-width: 2;
      fill: none;
      pointer-events: none;
      transition: stroke .2s;
    }

    input {
      width: 100%;
      padding: .75rem .9rem .75rem 2.5rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      color: var(--text);
      background: var(--cream);
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    input::placeholder { color: var(--muted); font-weight: 300; }

    input:focus {
      border-color: var(--rose);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(232,84,122,.12);
    }

    input:focus + svg,
    .input-wrap:focus-within svg { stroke: var(--rose); }

    /* toggle password */
    .toggle-pw {
      position: absolute;
      right: .9rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      color: var(--muted);
      transition: color .2s;
    }
    .toggle-pw:hover { color: var(--rose); }
    .toggle-pw svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2; fill: none; }

    /* ── Submit ── */
    .btn-submit {
      width: 100%;
      padding: .875rem;
      margin-top: .5rem;
      background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dk) 100%);
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: .9375rem;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: .02em;
      box-shadow: 0 4px 18px rgba(232,84,122,.35);
      transition: transform .15s, box-shadow .15s, opacity .15s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(232,84,122,.4);
    }

    .btn-submit:active { transform: translateY(0); opacity: .9; }

    /* ── Footer ── */
    .footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: .8125rem;
      color: var(--muted);
    }

    .footer a {
      color: var(--rose);
      font-weight: 500;
      text-decoration: none;
    }

    .footer a:hover { text-decoration: underline; }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin: 1.25rem 0;
      color: var(--muted);
      font-size: .75rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Validation visual */
    .form-group.error input { border-color: #e05555; }
    .form-group.success input { border-color: #5cb87a; }
    .error-msg {
      font-size: .75rem;
      color: #e05555;
      margin-top: .3rem;
      display: none;
    }
    .form-group.error .error-msg { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="avatar">
        <!-- strawberry icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C10.5 2 9.2 2.8 8.5 4c-.8-.3-1.7-.2-2.4.3C4.8 5.5 4.5 7.1 5 8.4 3.8 9.3 3 10.8 3 12.5 3 17.1 7 21 12 21s9-3.9 9-8.5c0-1.7-.8-3.2-2-4.1.5-1.3.2-2.9-1.1-4.1C17.2 3.8 16.3 3.7 15.5 4 14.8 2.8 13.5 2 12 2z"/>
          <circle cx="10" cy="12" r=".8"/>
          <circle cx="14" cy="12" r=".8"/>
          <circle cx="12" cy="15" r=".8"/>
          <circle cx="9"  cy="15.5" r=".6"/>
          <circle cx="15" cy="15.5" r=".6"/>
        </svg>
      </div>
      <h1>Crear Cuenta</h1>
      <p>Regístrate en Fresas con Crema</p>
    </div>

    <form id="registerForm" novalidate>
      <div class="form-group" id="grp-name">
        <label for="fullname">Nombre Completo</label>
        <div class="input-wrap">
          <input type="text" id="fullname" name="fullname" placeholder="Juan Pérez" autocomplete="name"/>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </div>
        <span class="error-msg">Por favor ingresa tu nombre completo.</span>
      </div>

      <div class="form-group" id="grp-email">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrap">
          <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email"/>
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg>
        </div>
        <span class="error-msg">Ingresa un correo electrónico válido.</span>
      </div>

      <div class="form-group" id="grp-phone">
        <label for="phone">Teléfono</label>
        <div class="input-wrap">
          <input type="tel" id="phone" name="phone" placeholder="300 123 4567" autocomplete="tel"/>
          <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7A2 2 0 0 1 22 16.9z"/></svg>
        </div>
        <span class="error-msg">Ingresa un número de teléfono válido.</span>
      </div>

      <div class="form-group" id="grp-pw">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password"/>
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <button type="button" class="toggle-pw" aria-label="Mostrar contraseña" data-target="password">
            <svg viewBox="0 0 24 24" class="eye-open"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span class="error-msg">La contraseña debe tener al menos 6 caracteres.</span>
      </div>

      <div class="form-group" id="grp-pw2">
        <label for="password2">Confirmar Contraseña</label>
        <div class="input-wrap">
          <input type="password" id="password2" name="password2" placeholder="••••••••" autocomplete="new-password"/>
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <button type="button" class="toggle-pw" aria-label="Mostrar contraseña" data-target="password2">
            <svg viewBox="0 0 24 24" class="eye-open"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span class="error-msg">Las contraseñas no coinciden.</span>
      </div>

      <button type="submit" class="btn-submit">Crear Cuenta</button>
    </form>

    <div class="divider">o</div>

    <p class="footer">¿Ya tienes cuenta? <a href="registro-web.html">Inicia sesión</a></p>
  </div>

  <script>
    // Toggle password visibility
    document.querySelectorAll('.toggle-pw').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });

    // Simple validation
    const form = document.getElementById('registerForm');

    function setStatus(groupId, valid, msg) {
      const grp = document.getElementById(groupId);
      grp.classList.toggle('error', !valid);
      grp.classList.toggle('success', valid);
      if (msg) grp.querySelector('.error-msg').textContent = msg;
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      let ok = true;

      const name  = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const pw    = document.getElementById('password').value;
      const pw2   = document.getElementById('password2').value;

      const nameOk  = name.length >= 2;
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      const phoneOk = /^[\d\s\+\-\(\)]{7,}$/.test(phone);
      const pwOk    = pw.length >= 6;
      const pw2Ok   = pw === pw2;

      setStatus('grp-name',  nameOk,  'Por favor ingresa tu nombre completo.');
      setStatus('grp-email', emailOk, 'Ingresa un correo electrónico válido.');
      setStatus('grp-phone', phoneOk, 'Ingresa un número de teléfono válido.');
      setStatus('grp-pw',    pwOk,    'La contraseña debe tener al menos 6 caracteres.');
      setStatus('grp-pw2',   pw2Ok,   'Las contraseñas no coinciden.');

      if (!nameOk || !emailOk || !phoneOk || !pwOk || !pw2Ok) return;

      // ✅ All valid — replace with your actual submit logic
      alert('¡Cuenta creada con éxito! 🍓');
    });
  </script>
</body>
</html>
